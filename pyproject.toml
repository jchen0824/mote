[project]
name = "personal-agent"
version = "0.1.0"
description = "Persistent personal agent with PostgreSQL jobs and OpenAI sandbox memory"
requires-python = ">=3.12"
dependencies = [
  "openai-agents[sqlalchemy,docker]==0.24.0",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
personal-agent = "personal_agent.cli:main"
personal-agent-eval = "personal_agent.evaluation.cli:main"

[project.optional-dependencies]
eval = [
    "hud==0.6.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
    "types-docker>=7.2.0.20261102",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "PGH"]

[tool.mypy]
files = ["src/personal_agent"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["hud", "hud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "integration: requires disposable PostgreSQL or Docker",
    "hud: requires the optional eval dependency; no hosted credentials",
]

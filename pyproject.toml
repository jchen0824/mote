[project]
name = "personal-agent"
version = "0.1.0"
description = "Persistent personal agent with PostgreSQL jobs and OpenAI sandbox memory"
requires-python = ">=3.12"
dependencies = [
  "openai-agents[sqlalchemy,docker]==0.24.0",
  "python-dotenv>=1.2,<2",
]

[project.scripts]
personal-agent = "personal_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
